name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Opens (or updates) a "Version Packages" PR that consumes the pending
  # changesets. Merging that PR is what publishes a real release - this job
  # publishes nothing on its own.
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Attempt to release
        uses: changesets/action@v1
        env:
          # The changelog plugin reads PR and commit metadata from the API, and
          # fails outright without a token.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        with:
          publish: pnpm changeset publish
          title: "chore: release"
          commit: "chore: release"

  # Every commit on main also goes out as a canary, so a fix can be tried
  # without waiting for the version PR to be merged.
  canary:
    runs-on: ubuntu-latest
    # Publishing needs a token; without one the job would fail on every push.
    if: ${{ github.repository == 'react-navigation/react-navigation-lynx' }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Setup npm registry
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: "https://registry.npmjs.org"

      - name: Version canary packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm changeset version --snapshot canary
          node .github/scripts/canary-snapshot.mjs

      - name: Publish canary packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm --recursive --filter "./packages/*" publish --no-git-checks --access public
