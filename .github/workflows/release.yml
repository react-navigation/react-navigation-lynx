name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Get current date
        id: date
        run: echo "date=$(date -u +'%Y-%m-%d %H:%M:%S')" >> "$GITHUB_OUTPUT"

      - name: Attempt to release
        id: changesets
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          pr-title: "chore: release ${{ steps.date.outputs.date }}"
          commit-message: "chore: release ${{ steps.date.outputs.date }}"

      - name: Publish packages
        if: steps.changesets.outputs.has-changesets == 'false'
        run: >
          pnpm --recursive --filter "./packages/*" publish
          --no-git-checks --access public

  canary:
    runs-on: ubuntu-latest
    environment: npm
    if: ${{ github.repository == 'react-navigation/react-navigation-lynx' }}
    permissions:
      contents: read
      pull-requests: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Version canary packages
        id: canary
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm changeset status --output "$RUNNER_TEMP/changeset-status.json"
          if ! jq -e '[.releases[] | select(.type != "none")] | length > 0' \
            "$RUNNER_TEMP/changeset-status.json" > /dev/null; then
            echo "No changesets to preview." >> "$GITHUB_STEP_SUMMARY"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          pnpm changeset version --snapshot canary
          node .github/scripts/canary-snapshot.mjs
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Publish canary packages
        if: steps.canary.outputs.publish == 'true'
        run: >
          pnpm --recursive --filter "./packages/*" publish
          --no-git-checks --access public --tag canary
