packages:
  - packages/*
  - examples/*
  # Vendored so we can track react-navigation and lynx-screens as they move,
  # instead of waiting on their releases. Only the packages we build on are
  # linked - pulling in the rest would drag React Native's toolchain along.
  - react-navigation/packages/core
  - react-navigation/packages/routers
  - lynx-screens

# lynx-screens pins @types/react 18, react-navigation pins 19. Two copies of
# React's types in one program means two incompatible ReactNode types, and
# every component boundary between the two starts erroring. Pinned to what
# react-navigation uses, since its sources are the ones we compile.
overrides:
  '@types/react': ~19.2.17

allowBuilds:
  core-js: true
  esbuild: true
